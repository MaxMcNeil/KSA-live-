name: Capture News
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Only needed if you ever have to swap models (see analysis.js comment)
      # GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '20' }
      - run: npm install playwright cheerio axios sharp rss-parser
      - run: npx playwright install chromium --with-deps
      - run: rm -f *.png total.json cards.json debug_*.html debug_*.png
      - run: node capture.js
      - run: node fetch-news.js || true
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git rm -r --cached node_modules > /dev/null 2>&1 || true
          git add -A
          git commit -m "Update cards" || echo "No changes"
          git push
