<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #4a0000 0%, #1a0000 55%, #000000 100%);
        }

        body::before, body::after {
            content: "";
            position: fixed;
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(
                45deg,
                #e40000 0px, #e40000 18px,
                #150000 18px, #150000 36px
            );
            opacity: 0.95;
            z-index: 1;
            animation: stripesMove 1s linear infinite;
        }
        body::before { left: 0; }
        body::after  { right: 0; }

        @keyframes stripesMove {
            from { background-position: 0 0; }
            to   { background-position: 0 51px; }
        }

        /* --- "war room" breaking news panel: prominent, animated, always Arabic --- */
        #warroom {
            position: relative;
            z-index: 6;
            flex: 0 0 auto;
            height: clamp(84px, 12vh, 128px);
            overflow: hidden;
            background: linear-gradient(180deg, #330000 0%, #0d0000 85%);
            border-bottom: 3px solid #ff1a1a;
            animation: warroomPulseBorder 2.4s ease-in-out infinite;
        }
        @keyframes warroomPulseBorder {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 -12px 22px rgba(0,0,0,0.6); }
            50%      { box-shadow: 0 0 55px rgba(255, 40, 40, 0.85), inset 0 -12px 22px rgba(0,0,0,0.6); }
        }
        .warroom-scan {
            position: absolute;
            left: 0; right: 0;
            height: 3px;
            top: -5%;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 100, 0.9), transparent);
            animation: warroomScanMove 3.2s linear infinite;
            pointer-events: none;
        }
        @keyframes warroomScanMove {
            0%   { top: -5%; }
            100% { top: 105%; }
        }
        .warroom-inner {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 26px;
            text-align: center;
            direction: rtl;
            box-sizing: border-box;
        }
        .warroom-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ff1414;
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            padding: 3px 18px;
            border-radius: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 14px rgba(255, 0, 0, 0.6);
            animation: warroomBadgeFlash 1.1s steps(1) infinite;
        }
        @keyframes warroomBadgeFlash {
            0%, 49%  { opacity: 1; }
            50%, 100% { opacity: 0.45; }
        }
        .warroom-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
        }
        .warroom-headline {
            font-weight: 900;
            font-size: clamp(1.1rem, 2.5vw, 1.7rem);
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 60, 60, 0.7);
            max-width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .warroom-headline.glitch { animation: warroomGlitch 0.4s steps(2); }
        @keyframes warroomGlitch {
            0%   { transform: translate(0, 0);      text-shadow: 2px 0 #ff2b2b, -2px 0 #2bd4ff; }
            25%  { transform: translate(-2px, 1px); text-shadow: -2px 0 #ff2b2b, 2px 0 #2bd4ff; }
            50%  { transform: translate(2px, -1px); text-shadow: 2px 0 #2bd4ff, -2px 0 #ff2b2b; }
            75%  { transform: translate(-1px, 0);   text-shadow: -2px 0 #2bd4ff, 2px 0 #ff2b2b; }
            100% { transform: translate(0, 0);      text-shadow: 0 0 10px rgba(255, 60, 60, 0.7); }
        }
        .warroom-source {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffb3b3;
        }

        #header {
            position: relative;
            flex: 0 0 auto;
            z-index: 5;
            text-align: center;
            padding: clamp(50px, 7vh, 120px) 16px 8px;
            pointer-events: none;
        }
        #header .title {
            font-size: 2.6rem;
            font-weight: 900;
            color: #ff3b3b;
            text-shadow: 0 0 14px rgba(255,0,0,0.9), 0 0 34px rgba(255,0,0,0.55);
            letter-spacing: 1px;
        }
        #header .status {
            margin-top: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffdede;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .live-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff1414;
        }

        #worldclock {
            position: relative;
            z-index: 5;
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 12px 4px;
            pointer-events: none;
        }
        .clock-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 0, 0, 0.55);
            border: 1px solid rgba(255, 80, 80, 0.35);
            border-radius: 20px;
            padding: 5px 14px;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.15);
        }
        .clock-city { font-size: 0.85rem; font-weight: 700; color: #ffcccc; }
        .clock-time { font-size: 0.95rem; font-weight: 900; color: #fff; direction: ltr; }

        /* --- animated channel logo, sits in its own clipped band so it can
             never overlap the title/subtitle above or the cards below --- */
        #logo-band {
            position: relative;
            z-index: 5;
            flex: 0 0 auto;
            height: clamp(56px, 8vh, 92px);
            overflow: hidden;
            pointer-events: none;
        }
        .logo-wrap {
            position: absolute;
            top: 50%;
            left: 10%;
            width: clamp(42px, 5.5vw, 66px);
            height: clamp(42px, 5.5vw, 66px);
            margin-top: clamp(-33px, -2.75vw, -21px);
            border-radius: 50%;
            animation: logoDrift 16s ease-in-out infinite, logoFlash 4.2s ease-in-out infinite;
        }
        .logo-spin {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #0a1830;
            border: 2px solid rgba(255, 205, 90, 0.75);
            box-shadow: 0 0 16px rgba(255, 190, 60, 0.55), 0 0 4px rgba(255, 255, 255, 0.4);
            animation: logoSpin 7s linear infinite;
        }
        .logo-spin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @keyframes logoSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes logoDrift {
            0%   { transform: translate(0, 0);        opacity: 1; }
            18%  { transform: translate(38px, -8px);  opacity: 1; }
            34%  { transform: translate(70px, 5px);   opacity: 1; }
            42%  { transform: translate(85px, 5px);   opacity: 0; }
            50%  { transform: translate(15px, 8px);   opacity: 0; }
            58%  { transform: translate(15px, 8px);   opacity: 1; }
            76%  { transform: translate(-8px, -6px);  opacity: 1; }
            100% { transform: translate(0, 0);        opacity: 1; }
        }
        @keyframes logoFlash {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 3px rgba(255, 215, 120, 0.35)); }
            50%      { filter: brightness(1.7) drop-shadow(0 0 16px rgba(255, 225, 150, 0.95)); }
        }

        #stage {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            z-index: 2;
            perspective: 2200px;
        }

        .card-slot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 92%;
            height: 92%;
            max-width: 1100px;
            max-height: 900px;
            transform: translate(-50%, -50%);
        }

        .page {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #0a0000;
            transform-style: preserve-3d;
            transform-origin: right center;
            transform: rotateY(0deg);
            transition: transform 1s cubic-bezier(.45,.05,.55,.95), opacity .5s ease-in .5s;
            backface-visibility: hidden;
        }
        .page.notransition { transition: none !important; }

        .page img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
        }
        .page.mode-summary img { display: none; }

        .page .sheen {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
            opacity: 0;
            pointer-events: none;
        }
        .page.folding .sheen { opacity: 1; animation: sheenSweep 1s ease-in-out; }
        @keyframes sheenSweep {
            from { transform: translateX(-100%); }
            to   { transform: translateX(100%); }
        }
        .page.folding { transform: rotateY(-150deg); opacity: 0; }

        .summary-panel {
            display: none;
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border-radius: 14px;
            background: linear-gradient(160deg, #360000 0%, #170000 65%, #000000 100%);
            border: 2px solid rgba(255, 70, 70, 0.4);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(255, 0, 0, 0.08);
            padding: clamp(24px, 4vw, 56px);
            flex-direction: column;
            justify-content: center;
            gap: clamp(16px, 3vh, 34px);
            direction: rtl;
            text-align: center;
        }
        .page.mode-summary .summary-panel { display: flex; }

        .summary-label {
            align-self: center;
            display: inline-block;
            background: #ff2a2a;
            color: #fff;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 6px 22px;
            border-radius: 20px;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
        }
        .summary-text {
            color: #ffeeee;
            font-weight: 700;
            font-size: clamp(1.3rem, 2.6vw, 2.1rem);
            line-height: 1.7;
            max-height: 60vh;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
        }
        .summary-source {
            align-self: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: #ff9d9d;
            border-top: 1px solid rgba(255, 120, 120, 0.35);
            padding-top: 14px;
        }

        #ticker-wrap {
            position: relative;
            z-index: 5;
            flex: 0 0 auto;
            height: 54px;
            overflow: hidden;
            background: linear-gradient(90deg, #1a0000, #4a0000 50%, #1a0000);
            border-top: 2px solid rgba(255, 60, 60, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
            display: flex;
            align-items: center;
        }
        #ticker-track {
            display: flex;
            white-space: nowrap;
            will-change: transform;
            transform: translateX(-50%);
            animation: tickerCrawl 180s linear infinite;
        }
        #ticker-track .ticker-copy {
            display: inline-block;
            padding-inline-end: 80px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffe3e3;
            direction: rtl;
        }
        @keyframes tickerCrawl {
            from { transform: translateX(-50%); }
            to   { transform: translateX(0%); }
        }

        #comment-popup {
            position: fixed;
            bottom: 70px;
            left: 50%;
            z-index: 20;
            transform: translate(-50%, 30px);
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(135deg, #ff2a2a, #8f0000);
            color: #fff;
            font-weight: 900;
            font-size: 1.3rem;
            padding: 16px 34px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.55);
            transition: transform .5s ease, opacity .5s ease;
            direction: rtl;
            text-align: center;
            max-width: 80vw;
        }
        #comment-popup.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body>
    <div id="warroom">
        <div class="warroom-scan"></div>
        <div class="warroom-inner">
            <div class="warroom-badge"><span class="warroom-dot"></span> عاجل — غرفة عمليات الخليج</div>
            <div class="warroom-headline" id="warroomHeadline">جاري تحميل آخر مستجدات السعودية والخليج…</div>
            <div class="warroom-source" id="warroomSource"></div>
        </div>
    </div>

    <div id="bg"></div>
    <div id="header">
        <div class="title">برقيات حينية</div>
        <div class="status" id="status">جاري التحميل...</div>
    </div>

    <div id="worldclock"></div>

    <div id="logo-band">
        <div class="logo-wrap">
            <div class="logo-spin">
                <img src="channel-logo.jpg" alt="Gulf Think-Tank">
            </div>
        </div>
    </div>

    <div id="stage">
        <div class="card-slot" id="slotA">
            <div class="page" id="pageA">
                <img id="imgA" alt="">
                <div class="sheen"></div>
                <div class="summary-panel">
                    <div class="summary-label">ملخص الخبر</div>
                    <div class="summary-text"></div>
                    <div class="summary-source"></div>
                </div>
            </div>
        </div>
        <div class="card-slot" id="slotB">
            <div class="page" id="pageB">
                <img id="imgB" alt="">
                <div class="sheen"></div>
                <div class="summary-panel">
                    <div class="summary-label">ملخص الخبر</div>
                    <div class="summary-text"></div>
                    <div class="summary-source"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="ticker-wrap">
        <div id="ticker-track">
            <span class="ticker-copy" id="tickerCopy1"></span>
            <span class="ticker-copy" id="tickerCopy2"></span>
        </div>
    </div>

    <div id="comment-popup"></div>

    <script>
        const IMAGE_DURATION_MS = 3000;    // how long the news card image stays on screen
        const SUMMARY_DURATION_MS = 15000; // how long the summary/source slide stays on screen (unchanged)
        const FOLD_MS = 1000;
        const REFRESH_MS = 5 * 60 * 1000;
        const POPUP_INTERVAL_MS = 2 * 60 * 1000;
        const NEWS_ROTATE_MS = 6000; // war-room headline rotation cadence

        let count = 0;
        let cardsData = [];
        let stepIndex = 0;
        let frontIsA = true;
        let cycleTimer = null;
        let audioCtx = null;
        let newsItems = [];
        let newsIdx = 0;

        function urlFor(i, ts) { return `card_${i}.png?t=${ts}`; }
        function setStatusLoading() { document.getElementById('status').textContent = 'جاري التحميل...'; }
        function setStatusLive(n) {
            document.getElementById('status').innerHTML =
                `<span class="live-dot"></span> مباشر — ${n} بطاقة إخبارية`;
        }

        function setSlotContent(slotId, step) {
            if (count <= 0) return;
            const page = document.getElementById(`page${slotId}`);
            const img = document.getElementById(`img${slotId}`);
            const cardIndex = Math.floor(step / 2) % count;
            const mode = (step % 2 === 0) ? 'image' : 'summary';

            page.classList.remove('mode-image', 'mode-summary');
            page.classList.add(mode === 'image' ? 'mode-image' : 'mode-summary');

            if (mode === 'image') {
                img.src = urlFor(cardIndex, Date.now());
            } else {
                const panel = page.querySelector('.summary-panel');
                const textEl = panel.querySelector('.summary-text');
                const sourceEl = panel.querySelector('.summary-source');
                const data = cardsData[cardIndex];
                if (data && data.summary) {
                    textEl.textContent = data.summary;
                    sourceEl.textContent = 'المصدر: ' + (data.source || 'غير معروف');
                } else {
                    textEl.textContent = 'لا يتوفر ملخص لهذا الخبر حالياً.';
                    sourceEl.textContent = '';
                }
            }
        }

        function beepType1(ctx, now) {
            [{ freq: 880, start: 0, dur: 0.12 }, { freq: 1180, start: 0.10, dur: 0.14 }].forEach(n => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = n.freq;
                gain.gain.setValueAtTime(0.0001, now + n.start);
                gain.gain.exponentialRampToValueAtTime(0.09, now + n.start + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + n.start);
                osc.stop(now + n.start + n.dur + 0.02);
            });
        }
        function beepType2(ctx, now) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = 660;
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }
        function beepType3(ctx, now) {
            [{ freq: 520, start: 0, dur: 0.1 }, { freq: 520, start: 0.14, dur: 0.1 }].forEach(n => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = n.freq;
                gain.gain.setValueAtTime(0.0001, now + n.start);
                gain.gain.exponentialRampToValueAtTime(0.07, now + n.start + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + n.start);
                osc.stop(now + n.start + n.dur + 0.02);
            });
        }
        const beepTypes = [beepType1, beepType2, beepType3];

        function playRandomBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                if (audioCtx.state !== 'running') {
                    console.warn('Audio still blocked (state=' + audioCtx.state + ') — see OBS audio checklist.');
                    return;
                }
                const now = audioCtx.currentTime;
                const fn = beepTypes[Math.floor(Math.random() * beepTypes.length)];
                fn(audioCtx, now);
            } catch (e) {
                console.warn('Beep failed (audio may be blocked):', e.message);
            }
        }

        function tryUnlockAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            } catch (e) { /* ignore */ }
        }
        ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt =>
            document.addEventListener(evt, tryUnlockAudio, { passive: true })
        );
        document.addEventListener('visibilitychange', tryUnlockAudio);

        const WORLD_CLOCK_CITIES = [
            { label: 'الرياض',   tz: 'Asia/Riyadh' },
            { label: 'القاهرة',  tz: 'Africa/Cairo' },
            { label: 'دبي',      tz: 'Asia/Dubai' },
            { label: 'لندن',     tz: 'Europe/London' },
            { label: 'نيويورك',  tz: 'America/New_York' },
            { label: 'طوكيو',    tz: 'Asia/Tokyo' }
        ];
        function renderWorldClock() {
            const el = document.getElementById('worldclock');
            const now = new Date();
            el.innerHTML = WORLD_CLOCK_CITIES.map(c => {
                const time = new Intl.DateTimeFormat('ar-SA', {
                    timeZone: c.tz, hour: '2-digit', minute: '2-digit', hour12: false
                }).format(now);
                return `<span class="clock-chip"><span class="clock-city">${c.label}</span><span class="clock-time">${time}</span></span>`;
            }).join('');
        }

        function updateTicker() {
            const items = [];
            cardsData.slice(0, 30).forEach(d => {
                if (d && d.summary) {
                    const short = d.summary.length > 110 ? d.summary.slice(0, 110).trim() + '…' : d.summary;
                    items.push(`${d.source ? d.source + ': ' : ''}${short}`);
                }
            });
            if (items.length === 0) items.push('برقيات حينية — آخر الأخبار أولاً بأول');

            const text = items.join('   •   ') + '   •   ';
            document.getElementById('tickerCopy1').textContent = text;
            document.getElementById('tickerCopy2').textContent = text;

            const track = document.getElementById('ticker-track');
            const seconds = Math.max(90, Math.round(text.length * 0.45));
            track.style.animationDuration = seconds + 's';
        }

        const COMMENT_MESSAGES = [
            'شاركونا رأيكم في التعليقات! 💬',
            'ما رأيكم في هذا الخبر؟ اكتبوا لنا الآن',
            'لا تنسوا الإعجاب ومشاركة البث مع أصدقائكم',
            'هل تتفاعلون معنا؟ التعليقات مفتوحة الآن',
            'أخبرونا من أين تتابعوننا اليوم؟',
            'شاركنا وجهة نظرك حول آخر الأخبار',
            'انضموا إلى النقاش في التعليقات 👇',
            'ما هو الخبر الذي لفت انتباهكم أكثر؟',
            'تفاعلكم يهمنا، اكتبوا تعليقاتكم الآن',
            'كونوا جزءًا من الحديث، شاركونا آراءكم'
        ];
        let lastCommentMsg = null;
        function showCommentPopup() {
            let msg;
            do {
                msg = COMMENT_MESSAGES[Math.floor(Math.random() * COMMENT_MESSAGES.length)];
            } while (msg === lastCommentMsg && COMMENT_MESSAGES.length > 1);
            lastCommentMsg = msg;

            const popup = document.getElementById('comment-popup');
            popup.textContent = msg;
            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 7000);
        }

        function initStage(newCount) {
            if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }

            count = newCount;
            stepIndex = 0;
            frontIsA = true;

            setSlotContent('A', 0);
            setSlotContent('B', 1);

            const pageA = document.getElementById('pageA');
            const pageB = document.getElementById('pageB');
            [pageA, pageB].forEach(p => {
                p.classList.add('notransition');
                p.classList.remove('folding');
            });
            void pageA.offsetWidth;
            [pageA, pageB].forEach(p => p.classList.remove('notransition'));

            document.getElementById('slotA').style.zIndex = 3;
            document.getElementById('slotB').style.zIndex = 2;

            setStatusLive(count);
            updateTicker();
            scheduleNextTurn();
        }

        function scheduleNextTurn() {
            if (count <= 0) return;
            // even step currently on screen = image (3s); odd step = summary (unchanged duration)
            const duration = (stepIndex % 2 === 0) ? IMAGE_DURATION_MS : SUMMARY_DURATION_MS;
            cycleTimer = setTimeout(turnPage, duration);
        }

        function turnPage() {
            if (count <= 0) return;

            const frontId = frontIsA ? 'A' : 'B';
            const backId  = frontIsA ? 'B' : 'A';
            const frontPage = document.getElementById(`page${frontId}`);
            const frontSlot = document.getElementById(`slot${frontId}`);
            const backSlot  = document.getElementById(`slot${backId}`);

            frontPage.classList.add('folding');
            playRandomBeep();

            setTimeout(() => {
                frontPage.classList.add('notransition');
                frontPage.classList.remove('folding');
                void frontPage.offsetWidth;
                frontPage.classList.remove('notransition');

                frontSlot.style.zIndex = 2;
                backSlot.style.zIndex = 3;

                stepIndex++;
                setSlotContent(frontId, stepIndex + 1);

                frontIsA = !frontIsA;
                scheduleNextTurn();
            }, FOLD_MS);
        }

        async function checkForUpdates() {
            try {
                const res = await fetch('total.json?t=' + Date.now());
                const data = await res.json();

                let newCards = [];
                try {
                    const cardsRes = await fetch('cards.json?t=' + Date.now());
                    if (cardsRes.ok) newCards = await cardsRes.json();
                } catch (e) { /* cards.json may not exist yet on older deployments */ }

                const countChanged = data.count && data.count !== count;
                cardsData = Array.isArray(newCards) ? newCards : [];

                if (countChanged) {
                    console.log(`Nouveau contenu détecté (${data.count} cartes), rechargement du diaporama...`);
                    initStage(data.count);
                } else {
                    updateTicker();
                }
            } catch (e) {
                console.error("En attente des données...", e);
            }
        }

        async function refreshNews() {
            try {
                const res = await fetch('news.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) newsItems = data;
                }
            } catch (e) {
                // keep whatever we already had — the panel below still rotates
            }
        }

        function showNextNews() {
            const headlineEl = document.getElementById('warroomHeadline');
            const sourceEl = document.getElementById('warroomSource');
            if (!newsItems.length) {
                headlineEl.classList.remove('glitch');
                void headlineEl.offsetWidth;
                headlineEl.textContent = 'بانتظار ورود مستجدات جديدة من السعودية والخليج…';
                sourceEl.textContent = '';
                headlineEl.classList.add('glitch');
                return;
            }
            const item = newsItems[newsIdx % newsItems.length];
            newsIdx++;
            headlineEl.classList.remove('glitch');
            void headlineEl.offsetWidth;
            headlineEl.textContent = item.title;
            sourceEl.textContent = item.source ? 'المصدر: ' + item.source : '';
            headlineEl.classList.add('glitch');
        }

        async function init() {
            setStatusLoading();
            tryUnlockAudio();
            renderWorldClock();
            setInterval(renderWorldClock, 1000);

            setTimeout(showCommentPopup, 20000);
            setInterval(showCommentPopup, POPUP_INTERVAL_MS);

            await refreshNews();
            showNextNews();
            setInterval(showNextNews, NEWS_ROTATE_MS);
            setInterval(refreshNews, REFRESH_MS);

            await checkForUpdates();
            setInterval(checkForUpdates, REFRESH_MS);
        }

        init();
    </script>
</body>
</html>
